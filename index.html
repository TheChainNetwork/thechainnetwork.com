<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chain Network — Clear, honest crypto education</title>
<meta name="description" content="Clear, honest crypto education. Always free. Full video guides that take you from zero to confident. Website live July 2026.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/img/favicon.png">
<meta property="og:title" content="Chain Network">
<meta property="og:description" content="Clear, honest crypto education. Always free. Website live July 2026.">
<meta property="og:image" content="assets/img/banner-x.png">
<meta name="theme-color" content="#1e293b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1e293b;--navy-deep:#0f1b2d;--gold:#fbbf24;--cyan:#22d3ee;--text:#f5f7fa;--muted:#9fb0c3;--line:#33445c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--navy-deep);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:32px 20px;line-height:1.6;
    background-image:radial-gradient(900px 420px at 50% 8%,rgba(34,211,238,.10),transparent 60%),radial-gradient(700px 360px at 78% 4%,rgba(251,191,36,.08),transparent 55%)}
  .card{max-width:680px;text-align:center}
  img.logo{width:128px;height:128px;border-radius:50%;margin:0 auto 30px;box-shadow:0 0 0 1px var(--line),0 18px 50px rgba(0,0,0,.45)}
  h1{font-family:'Montserrat',sans-serif;font-weight:800;color:#fff;font-size:clamp(1.5rem,4.4vw,2.15rem);letter-spacing:-.01em;line-height:1.28;margin-bottom:22px}
  h1 .g{color:var(--gold)}
  h1 .c{color:var(--cyan)}
  .tagline{font-family:'Montserrat',sans-serif;font-weight:600;color:var(--cyan);letter-spacing:.05em;font-size:.95rem;margin-bottom:14px;text-transform:uppercase}
  .live{display:inline-block;margin-top:28px;border:1px solid var(--gold);color:var(--gold);font-family:'Montserrat',sans-serif;font-weight:700;font-size:1rem;padding:11px 24px;border-radius:999px}
  .nfa{margin-top:34px;color:var(--muted);font-size:.82rem;letter-spacing:.04em}
  .nfa .sep{color:var(--line);margin:0 8px}
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/img/logo-avatar.png" alt="Chain Network logo">
    <p class="tagline">Transparent by Design. Honest by Default.</p>
    <h1>
      <span class="g">Clear, honest crypto education. Always free.</span>
      Full video guides that take you from zero to confident.
      <span class="c">Learn it once, come back anytime.</span>
    </h1>
    <span class="live">Website live July 2026</span>
    <p class="nfa">Chain Network<span class="sep">|</span>Education, not financial advice</p>
  </main>
</body>
</html>
